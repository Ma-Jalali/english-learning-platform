<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 180" role="img" aria-labelledby="title desc">
  <title id="title">Porcelain Atlas support symbols</title>
  <desc id="desc">An exam strategy compass, a listening media waveform and a feedback insight lens share one route.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffefd"/><stop offset="1" stop-color="#f7f4ee"/></linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#5b4032" flood-opacity=".12"/></filter>
  </defs>
  <path d="M90 90H570" fill="none" stroke="#d9d1c8" stroke-width="2" stroke-dasharray="5 9"/>
  <g filter="url(#lift)">
    <rect x="28" y="28" width="144" height="124" rx="34" fill="url(#paper)" stroke="#fff"/>
    <rect x="258" y="28" width="144" height="124" rx="34" fill="url(#paper)" stroke="#fff"/>
    <rect x="488" y="28" width="144" height="124" rx="34" fill="url(#paper)" stroke="#fff"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="84" r="34" stroke="#5a345c" stroke-width="5"/>
    <path d="m100 55 13 27-13 32-13-27Z" stroke="#bd4013" stroke-width="5"/>
    <circle cx="100" cy="84" r="5" fill="#f15a2a" stroke="none"/>
    <path d="M292 91c11 0 11-30 22-30s11 54 22 54 11-61 22-61 11 37 22 37" stroke="#3158c7" stroke-width="5"/>
    <circle cx="292" cy="91" r="6" fill="#f15a2a" stroke="none"/>
    <path d="M522 103c20-34 46-46 76-38-7 31-31 52-62 49" stroke="#5a345c" stroke-width="5"/>
    <path d="m531 91 11 11 23-25" stroke="#bd4013" stroke-width="5"/>
  </g>
  <g fill="#3d3838" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <text x="100" y="140">STRATEGY</text><text x="330" y="140">LISTENING</text><text x="560" y="140">INSIGHT</text>
  </g>
</svg>
