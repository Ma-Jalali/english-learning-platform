<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">IELTS learning atlas</title>
  <desc id="desc">A route links the four IELTS skills to a central understanding marker, with annotations representing evidence and strategy.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1a1813" flood-opacity=".13"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#efe6d7"/>
    </linearGradient>
  </defs>
  <path d="M98 410C164 354 188 255 275 245S390 329 470 257s92-166 187-152" fill="none" stroke="#1d4fc4" stroke-width="8" stroke-linecap="round"/>
  <path d="M99 410C159 372 221 376 278 398s100 39 164-9 99-109 194-79" fill="none" stroke="#c94f12" stroke-width="3" stroke-dasharray="5 13" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <path d="M80 72h230l45 42-22 128H100L63 168z" fill="url(#paper)"/>
    <path d="M441 64h190l60 80-38 102H430l-29-99z" fill="#fffaf0"/>
    <path d="M217 292h260l56 48-31 123H235l-58-69z" fill="#fffdf8"/>
  </g>
  <g fill="#171714" font-family="Arial, sans-serif">
    <text x="102" y="115" font-size="13" font-weight="700" letter-spacing="2">NOTICE</text>
    <text x="102" y="153" font-family="Georgia, serif" font-size="34">Reading</text>
    <text x="102" y="184" font-size="15" fill="#5d5850">Find the claim. Trace the evidence.</text>
    <text x="468" y="112" font-size="13" font-weight="700" letter-spacing="2">VOICE</text>
    <text x="468" y="151" font-family="Georgia, serif" font-size="34">Listening</text>
    <text x="468" y="181" font-size="15" fill="#5d5850">Purpose · detail · position</text>
    <text x="252" y="343" font-size="13" font-weight="700" letter-spacing="2">RESPONSE</text>
    <text x="252" y="384" font-family="Georgia, serif" font-size="35">Writing + Speaking</text>
    <text x="252" y="417" font-size="15" fill="#5d5850">Organise meaning for a real reader or listener.</text>
  </g>
  <g>
    <circle cx="99" cy="410" r="18" fill="#c94f12"/>
    <circle cx="278" cy="398" r="15" fill="#fffdf8" stroke="#c94f12" stroke-width="6"/>
    <circle cx="470" cy="257" r="18" fill="#1d4fc4"/>
    <circle cx="657" cy="105" r="18" fill="#fffdf8" stroke="#1d4fc4" stroke-width="6"/>
  </g>
  <path d="M365 260l31-31 31 31-31 31z" fill="#171714"/>
  <text x="382" y="266" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="800">4</text>
  <g fill="none" stroke="#171714" stroke-width="2">
    <path d="M52 288h104"/>
    <path d="M564 286h140"/>
    <path d="M568 310h92"/>
  </g>
  <g fill="#171714" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">
    <text x="52" y="278">CONTEXT</text>
    <text x="564" y="276">EVIDENCE</text>
    <text x="568" y="334">STRATEGY</text>
  </g>
</svg>
