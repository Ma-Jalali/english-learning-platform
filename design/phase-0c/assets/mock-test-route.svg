<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
  <title id="title">How mock-test access works</title>
  <desc id="desc">Three compact steps: choose a test bundle, receive new tests automatically, and find them in My Mock Tests.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".96"/><stop offset="1" stop-color="#f8f3ef" stop-opacity=".8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="11" stdDeviation="11" flood-color="#382c30" flood-opacity=".11"/></filter>
  </defs>
  <rect x="1" y="1" width="958" height="268" rx="34" fill="#f7f4f3" stroke="#e1d8d2"/>
  <path d="M212 83h112M527 83h112" stroke="#d8cec8" stroke-width="2" stroke-linecap="round"/>
  <path d="M300 83l18-9v18zM615 83l18-9v18z" fill="#f15a2a"/>
  <g filter="url(#shadow)">
    <g transform="translate(42 32)"><rect width="170" height="102" rx="24" fill="url(#surface)" stroke="#fff" stroke-width="2"/><rect x="24" y="22" width="38" height="48" rx="8" fill="#fff5ef" stroke="#f15a2a" stroke-width="3"/><path d="M33 38h20M33 48h20M33 58h14" stroke="#5a345c" stroke-width="3" stroke-linecap="round"/><circle cx="57" cy="68" r="7" fill="#f15a2a"/></g>
    <g transform="translate(357 32)"><rect width="170" height="102" rx="24" fill="url(#surface)" stroke="#fff" stroke-width="2"/><path d="M40 53c20-30 53-30 73 0" fill="none" stroke="#5a345c" stroke-width="5" stroke-linecap="round"/><circle cx="40" cy="53" r="8" fill="#3158c7"/><circle cx="77" cy="34" r="9" fill="#f15a2a"/><circle cx="113" cy="53" r="8" fill="#3158c7"/><path d="M123 32l10 10 18-22" fill="none" stroke="#1d7a4d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(672 32)"><rect width="246" height="102" rx="24" fill="url(#surface)" stroke="#fff" stroke-width="2"/><rect x="24" y="25" width="38" height="48" rx="8" fill="#f1edf5" stroke="#5a345c" stroke-width="3"/><rect x="74" y="25" width="38" height="48" rx="8" fill="#fff5ef" stroke="#f15a2a" stroke-width="3"/><rect x="124" y="25" width="38" height="48" rx="8" fill="#eef3ff" stroke="#3158c7" stroke-width="3"/><path d="M185 48h30M200 33v30" stroke="#f15a2a" stroke-width="5" stroke-linecap="round"/></g>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle"><text x="127" y="172" fill="#5a345c" font-size="13" font-weight="700" letter-spacing="2">STEP 1</text><text x="127" y="201" fill="#171714" font-family="Georgia, serif" font-size="24">Choose an option</text><text x="127" y="225" fill="#686164" font-size="14">One test or a bundle</text>
  <text x="442" y="172" fill="#5a345c" font-size="13" font-weight="700" letter-spacing="2">STEP 2</text><text x="442" y="201" fill="#171714" font-family="Georgia, serif" font-size="24">Receive new tests</text><text x="442" y="225" fill="#686164" font-size="14">Assigned automatically</text>
  <text x="795" y="172" fill="#5a345c" font-size="13" font-weight="700" letter-spacing="2">STEP 3</text><text x="795" y="201" fill="#171714" font-family="Georgia, serif" font-size="24">Open My Mock Tests</text><text x="795" y="225" fill="#686164" font-size="14">Start when you are ready</text></g>
</svg>
