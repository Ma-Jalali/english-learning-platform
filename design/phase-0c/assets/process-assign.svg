<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
  <title id="title">Receive only new mock tests</title>
  <desc id="desc">Existing tests 1 and 2 are recognised with verification marks, while two new numbered tests move along curved arrows into the open library position without duplicates.</desc>
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#fbf8f8"/><stop offset="1" stop-color="#f4eef1"/></linearGradient>
    <linearGradient id="coverWarm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdfb"/><stop offset=".65" stop-color="#fff6f1"/><stop offset="1" stop-color="#ffe9dd"/></linearGradient>
    <linearGradient id="coverPlum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdfbfe"/><stop offset="1" stop-color="#efe6f1"/></linearGradient>
    <linearGradient id="coverMuted" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f6f7"/><stop offset="1" stop-color="#eeeaec"/></linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b79db6"/><stop offset="1" stop-color="#9b7c9a"/></linearGradient>
    <linearGradient id="spineMuted" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b7aab4"/><stop offset="1" stop-color="#a69aa3"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7865f"/><stop offset="1" stop-color="#c44216"/></linearGradient>
    <linearGradient id="action" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9531f"/><stop offset="1" stop-color="#b73a10"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8f4f5"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f15a2a" stop-opacity=".16"/><stop offset="1" stop-color="#f15a2a" stop-opacity="0"/></radialGradient>
    <filter id="lift" x="-30%" y="-24%" width="160%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#4a273e" flood-opacity=".13"/></filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4a273e" flood-opacity=".09"/></filter>
    <filter id="blur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
